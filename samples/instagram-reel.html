<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Reel Demo | html2mp4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #0a0a14;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Animated background blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
  }
  .blob-1 {
    width: 500px; height: 500px;
    background: #00d4ff;
    top: 10%; left: -10%;
    animation: blobMove1 6s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 400px; height: 400px;
    background: #8b5cf6;
    bottom: 15%; right: -10%;
    animation: blobMove2 5s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 300px; height: 300px;
    background: #3b82f6;
    top: 40%; right: 20%;
    animation: blobMove3 7s ease-in-out infinite alternate;
  }

  @keyframes blobMove1 {
    to { transform: translate(100px, 80px) scale(1.2); }
  }
  @keyframes blobMove2 {
    to { transform: translate(-80px, -60px) scale(0.9); }
  }
  @keyframes blobMove3 {
    to { transform: translate(-60px, 100px) scale(1.1); }
  }

  /* Content */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 80px;
  }

  .emoji {
    font-size: 80px;
    opacity: 0;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards;
  }

  .headline {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    margin: 40px 0 24px;
    opacity: 0;
    animation: slideUp 0.8s ease 1s forwards;
  }

  .subtext {
    font-size: 32px;
    color: rgba(255,255,255,0.6);
    line-height: 1.4;
    opacity: 0;
    animation: slideUp 0.8s ease 1.5s forwards;
  }

  .tag {
    display: inline-block;
    margin-top: 48px;
    padding: 16px 40px;
    border: 2px solid rgba(0, 212, 255, 0.4);
    border-radius: 50px;
    font-size: 24px;
    font-weight: 600;
    color: #00d4ff;
    opacity: 0;
    animation: slideUp 0.8s ease 2s forwards;
  }

  /* Bottom handle */
  .handle {
    position: absolute;
    bottom: 100px;
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    z-index: 2;
    opacity: 0;
    animation: fadeIn 1s ease 2.5s forwards;
  }

  /* Animated dots */
  .dots {
    position: absolute;
    top: 120px;
    display: flex;
    gap: 12px;
    z-index: 2;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }
  .dot.active {
    background: #00d4ff;
    box-shadow: 0 0 12px #00d4ff;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="content">
    <div class="emoji">🚀</div>
    <h1 class="headline">Turn HTML into video</h1>
    <p class="subtext">Create stunning social content from code, no cloud needed</p>
    <div class="tag">#html2mp4</div>
  </div>

  <div class="handle">@html2mp4</div>
</div>
</body>
</html>
