<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation Slides Demo — html2mp4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background: #0f0f1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 120px;
    opacity: 0;
  }

  /* Slide 1: Title */
  .slide-1 {
    animation: slideIn 0.8s ease 0.3s forwards, slideOut 0.8s ease 3s forwards;
    align-items: center;
    text-align: center;
  }
  .slide-1 h1 {
    font-size: 72px;
    font-weight: 800;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .slide-1 p {
    font-size: 28px;
    color: rgba(255,255,255,0.5);
  }

  /* Slide 2: Stats */
  .slide-2 {
    animation: slideIn 0.8s ease 3.5s forwards, slideOut 0.8s ease 6.5s forwards;
  }
  .slide-2 h2 {
    font-size: 48px;
    color: #fff;
    margin-bottom: 48px;
    font-weight: 700;
  }
  .stats {
    display: flex;
    gap: 40px;
  }
  .stat-card {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 40px;
    opacity: 0;
  }
  .slide-2 .stat-card:nth-child(1) { animation: cardIn 0.6s ease 4s forwards; }
  .slide-2 .stat-card:nth-child(2) { animation: cardIn 0.6s ease 4.3s forwards; }
  .slide-2 .stat-card:nth-child(3) { animation: cardIn 0.6s ease 4.6s forwards; }
  .stat-number {
    font-size: 56px;
    font-weight: 800;
    background: linear-gradient(135deg, #00d4ff, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label {
    font-size: 20px;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
  }

  /* Slide 3: CTA */
  .slide-3 {
    animation: slideIn 0.8s ease 7s forwards;
    align-items: center;
    text-align: center;
  }
  .slide-3 h2 {
    font-size: 64px;
    color: #fff;
    font-weight: 800;
    margin-bottom: 24px;
  }
  .cta-btn {
    display: inline-block;
    padding: 20px 60px;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    border-radius: 50px;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    animation: cardIn 0.6s ease 7.8s forwards;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(255,255,255,0.05);
  }
  .bottom-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00d4ff, #8b5cf6);
    animation: progress 10s linear forwards;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-30px); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes progress {
    to { width: 100%; }
  }
</style>
</head>
<body>
  <div class="slide slide-1">
    <h1>Q4 Product Update</h1>
    <p>Building the future, one feature at a time</p>
  </div>

  <div class="slide slide-2">
    <h2>Key Metrics</h2>
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number">2.4M</div>
        <div class="stat-label">Active Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">98.7%</div>
        <div class="stat-label">Uptime</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">4.8★</div>
        <div class="stat-label">App Rating</div>
      </div>
    </div>
  </div>

  <div class="slide slide-3">
    <h2>Ready to scale?</h2>
    <div class="cta-btn">Get Started</div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-bar-fill"></div>
  </div>
</body>
</html>
