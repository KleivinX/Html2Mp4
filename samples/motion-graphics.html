<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Graphics Demo — html2mp4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background: #0a0a14;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Animated gradient background */
  .bg-gradient {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(0, 212, 255, 0.15), transparent 60%),
                radial-gradient(circle at 70% 50%, rgba(139, 92, 246, 0.15), transparent 60%);
    animation: bgPulse 4s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #00d4ff;
    border-radius: 50%;
    opacity: 0;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0% { opacity: 0; transform: translateY(100px) scale(0); }
    50% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
  }

  /* Main title */
  .title {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -3px;
    text-align: center;
    z-index: 2;
    opacity: 0;
    animation: titleIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }
  .title span {
    background: linear-gradient(135deg, #00d4ff, #3b82f6, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  @keyframes titleIn {
    0% { opacity: 0; transform: translateY(40px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Subtitle */
  .subtitle {
    position: absolute;
    bottom: 180px;
    font-size: 28px;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 8px;
    text-transform: uppercase;
    opacity: 0;
    animation: subtitleIn 1s ease 1.5s forwards;
    z-index: 2;
  }
  @keyframes subtitleIn {
    0% { opacity: 0; transform: translateY(20px); letter-spacing: 20px; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
  }

  /* Decorative ring */
  .ring {
    position: absolute;
    width: 400px;
    height: 400px;
    border: 2px solid rgba(0, 212, 255, 0.2);
    border-radius: 50%;
    animation: ringRotate 8s linear infinite;
  }
  .ring::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    width: 8px;
    height: 8px;
    background: #00d4ff;
    border-radius: 50%;
    box-shadow: 0 0 20px #00d4ff;
  }
  @keyframes ringRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .ring-2 {
    width: 500px;
    height: 500px;
    border-color: rgba(139, 92, 246, 0.15);
    animation-duration: 12s;
    animation-direction: reverse;
  }
  .ring-2::before { background: #8b5cf6; box-shadow: 0 0 20px #8b5cf6; }

  /* Bottom line */
  .line {
    position: absolute;
    bottom: 120px;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00d4ff, #8b5cf6, transparent);
    animation: lineGrow 1.5s ease 2s forwards;
    z-index: 2;
  }
  @keyframes lineGrow {
    to { width: 400px; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="bg-gradient"></div>
  <div class="ring"></div>
  <div class="ring ring-2"></div>
  <h1 class="title"><span>html2mp4</span></h1>
  <p class="subtitle">Motion Graphics Demo</p>
  <div class="line"></div>
</div>

<script>
// Generate floating particles
const scene = document.querySelector('.scene');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = Math.random() * 100 + '%';
  p.style.animationDelay = (Math.random() * 3) + 's';
  p.style.animationDuration = (2 + Math.random() * 2) + 's';
  if (Math.random() > 0.5) p.style.background = '#8b5cf6';
  scene.appendChild(p);
}
</script>
</body>
</html>
